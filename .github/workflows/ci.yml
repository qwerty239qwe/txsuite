name: ci

on:
  push:
  pull_request:

# Every push to a PR branch triggered two identical runs. Supersede instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v

  contrast-r:
    # The contrast-set tests execute plain R extracted from the shipped DE
    # scripts. They skip without Rscript, so they live in their own bounded job:
    # setting R up inside the Python matrix hung apt and cost three job slots.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: python -m pip install -e .
      - run: Rscript -e 'cat(R.version.string, "\n")'
      - run: python -m unittest -v tests.test_de_contrasts

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - id: wheel
        shell: bash
        run: echo "path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)" >> "$GITHUB_OUTPUT"
      - name: Inspect wheel resources offline
        env:
          TXSUITE_WHEEL: ${{ steps.wheel.outputs.path }}
        run: python -m unittest -v tests.test_packaging
      - run: python -m venv /tmp/txsuite-wheel-smoke
      - run: /tmp/txsuite-wheel-smoke/bin/python -m pip install --no-deps "${{ steps.wheel.outputs.path }}"
      - name: Smoke installed resources outside the checkout
        working-directory: /tmp
        run: >-
          /tmp/txsuite-wheel-smoke/bin/python -c
          "from importlib import resources;
          root=resources.files('txsuite.resources.project');
          assert root.joinpath('workflow.schema.json').is_file();
          assert root.joinpath('presets','bulk-rnaseq','workflow.toml').is_file()"

  nextflow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: nf-core/setup-nextflow@v3
        with:
          # Must be an exact published release: the resolver matches against a
          # list of tags, which contains v26.04.6 but no bare v26.04, so a
          # two-component pin never matches and the job dies before any run.
          version: "26.04.6"
      - run: touch /tmp/txsuite-stub.h5ad
      - run: >-
          nextflow run src/txsuite/resources/nextflow/main.nf
          -stub-run -profile local,stub
          -work-dir /tmp/txsuite-nextflow-work
          --input /tmp/txsuite-stub.h5ad
          --manifest "$PWD/examples/single_cell/comparisons.example.tsv"
          --outdir /tmp/txsuite-nextflow-results
          --single_cell_image txsuite/single-cell-python:stub
          --bulk_image txsuite/bulk-r:stub
      - run: |
          mkdir -p /tmp/txsuite-salmon
          printf 'sample,fastq_1,fastq_2\n' > /tmp/txsuite-salmon/samplesheet.csv
          touch /tmp/txsuite-salmon/sample1_R1.fastq.gz /tmp/txsuite-salmon/sample1_R2.fastq.gz
          printf 'sample1,/tmp/txsuite-salmon/sample1_R1.fastq.gz,/tmp/txsuite-salmon/sample1_R2.fastq.gz\n' >> /tmp/txsuite-salmon/samplesheet.csv
          touch /tmp/txsuite-salmon/genome.fa /tmp/txsuite-salmon/genes.gtf
      - run: >-
          nextflow run src/txsuite/resources/nextflow/bulk_salmon.nf
          -stub-run -profile local,stub
          -work-dir /tmp/txsuite-salmon-work
          --samplesheet /tmp/txsuite-salmon/samplesheet.csv
          --fasta /tmp/txsuite-salmon/genome.fa
          --gtf /tmp/txsuite-salmon/genes.gtf
          --outdir /tmp/txsuite-salmon-results
          --salmon_image txsuite/salmon:stub
      - run: |
          test -s /tmp/txsuite-salmon-results/counts/gene_counts.tsv
          test -s /tmp/txsuite-salmon-results/counts/transcript_counts.tsv
          test -s /tmp/txsuite-salmon-results/reference/tx2gene.tsv
      - run: >-
          nextflow run src/txsuite/resources/nextflow/single_cell_alevin.nf
          -stub-run -profile local,stub
          -work-dir /tmp/txsuite-alevin-work
          --samplesheet /tmp/txsuite-salmon/samplesheet.csv
          --fasta /tmp/txsuite-salmon/genome.fa
          --gtf /tmp/txsuite-salmon/genes.gtf
          --outdir /tmp/txsuite-alevin-results
          --salmon_image txsuite/salmon:stub
          --single_cell_image txsuite/single-cell-python:stub
      - run: test -f /tmp/txsuite-alevin-results/matrix/alevin.h5ad
      - run: >-
          nextflow run src/txsuite/resources/nextflow/bulk_star_reference.nf
          -stub-run -profile local,stub
          -work-dir /tmp/txsuite-star-ref-work
          --fasta /tmp/txsuite-salmon/genome.fa
          --gtf /tmp/txsuite-salmon/genes.gtf
          --outdir /tmp/txsuite-star-ref-results
          --star_image txsuite/star:stub
          --star_read_length 100
          --star_sjdb_overhang 99
      - run: |
          test -s /tmp/txsuite-star-ref-results/star_index/SA
          test -s /tmp/txsuite-star-ref-results/reference/genome.fa.fai
          test -s /tmp/txsuite-star-ref-results/reference/genome.dict
          grep -q 'sjdb_overhang	99' /tmp/txsuite-star-ref-results/reference/reference-manifest.tsv
      - run: >-
          nextflow run src/txsuite/resources/nextflow/bulk_align.nf
          -stub-run -profile local,stub
          -work-dir /tmp/txsuite-align-work
          --samplesheet /tmp/txsuite-salmon/samplesheet.csv
          --star_index /tmp/txsuite-star-ref-results/star_index
          --outdir /tmp/txsuite-align-results
          --star_image txsuite/star:stub
      - run: |
          test -s /tmp/txsuite-align-results/counts/gene_counts.tsv
          test -s /tmp/txsuite-align-results/counts/strandedness.tsv
          test -s /tmp/txsuite-align-results/alignments/sample1.Aligned.sortedByCoord.out.bam
          test -s /tmp/txsuite-align-results/alignments/sample1.Aligned.sortedByCoord.out.bam.bai
          test -s /tmp/txsuite-align-results/logs/sample1.Log.final.out
      - run: mkdir -p /tmp/txsuite-cellranger-fastqs && touch /tmp/txsuite-cellranger-genome.fa /tmp/txsuite-cellranger-genes.gtf
      - run: >-
          nextflow run src/txsuite/resources/nextflow/single_cell_cellranger.nf
          -stub-run -profile local,stub
          -work-dir /tmp/txsuite-cellranger-work
          --genome_name GRCh38.p14
          --fasta /tmp/txsuite-cellranger-genome.fa
          --gtf /tmp/txsuite-cellranger-genes.gtf
          --fastqs /tmp/txsuite-cellranger-fastqs
          --sample sample1
          --outdir /tmp/txsuite-cellranger-results

  single-cell-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t txsuite-single-cell:test src/txsuite/resources/single_cell_python
      - run: mkdir -p /tmp/txsuite-single-cell/analysis /tmp/txsuite-single-cell/pca /tmp/txsuite-single-cell/pseudobulk
      - run: >-
          docker run --rm
          -v "$PWD/examples/single_cell/filtered_feature_bc_matrix:/input/data:ro"
          -v "$PWD/examples/single_cell/metadata.example.tsv:/input/metadata.tsv:ro"
          -v "/tmp/txsuite-single-cell/analysis:/output"
          txsuite-single-cell:test
          python /opt/txsuite/single_cell.py analyze /input/data /output
          --metadata /input/metadata.tsv
          --batch-column batch
          --integration harmony
          --min-genes 1 --min-cells 1 --max-mito-pct 100 --resolution 1
          --target-sum 5000 --n-hvg 12 --n-pcs 5 --n-neighbors 4
          --umap-min-dist 0.2 --marker-method t-test
          --doublets score --doublet-threshold 1 --top-markers 10
      - run: >-
          docker run --rm
          -v "/tmp/txsuite-single-cell/analysis/analysis.h5ad:/input/data.h5ad:ro"
          -v "/tmp/txsuite-single-cell/pseudobulk:/output"
          txsuite-single-cell:test
          python /opt/txsuite/single_cell.py pseudobulk /input/data.h5ad /output
          --sample-column sample --design condition
          --group-column cell_type --group-value T_cell
          --covariate batch --reference control --test treated
      - run: >-
          docker run --rm
          -v "/tmp/txsuite-single-cell/analysis/analysis.h5ad:/input/data.h5ad:ro"
          -v "/tmp/txsuite-single-cell/pca:/output"
          txsuite-single-cell:test
          python /opt/txsuite/single_cell.py analyze /input/data.h5ad /output
          --counts-layer counts --stop-after pca
          --min-genes 1 --min-cells 1 --max-mito-pct 100 --n-hvg 12 --n-pcs 5
      - run: >-
          docker run --rm
          -v "/tmp/txsuite-single-cell/analysis/analysis.h5ad:/input/data.h5ad:ro"
          txsuite-single-cell:test
          python -c "import numpy as np, scanpy as sc;
          a = sc.read_h5ad('/input/data.h5ad');
          assert a.obsm['X_pca'].shape == a.obsm['X_pca_harmony'].shape;
          assert np.isfinite(a.obsm['X_pca_harmony']).all();
          assert a.uns['neighbors']['params']['use_rep'] == 'X_pca_harmony'"
      - run: >-
          docker run --rm
          -v "/tmp/txsuite-single-cell/pca/analysis.h5ad:/input/data.h5ad:ro"
          txsuite-single-cell:test
          python -c "import numpy as np, scanpy as sc;
          a = sc.read_h5ad('/input/data.h5ad'); x = a.layers['counts'];
          v = x.data if hasattr(x, 'data') else np.asarray(x);
          assert np.all(v >= 0) and np.allclose(v, np.rint(v));
          assert 'X_pca' in a.obsm and 'X_umap' not in a.obsm and 'leiden' not in a.obs"
      - name: Convert a USA-mode alevin-fry bundle to h5ad
        run: |
          mkdir -p /tmp/txsuite-alevin/sample1/af_quant/alevin /tmp/txsuite-alevin-h5ad
          cd /tmp/txsuite-alevin/sample1/af_quant/alevin
          printf '%%%%MatrixMarket matrix coordinate real general\n%%\n2 6 3\n1 1 3\n2 2 5\n1 5 1\n' > quants_mat.mtx
          printf 'AAACCTGAGAAACCAT\nAAACCTGAGAAACCGC\n' > quants_mat_rows.txt
          printf 'gene1-S\ngene2-S\ngene1-U\ngene2-U\ngene1-A\ngene2-A\n' > quants_mat_cols.txt
          printf '{"usa_mode": true}\n' > quants_mat.json
      - run: >-
          docker run --rm
          -v "/tmp/txsuite-alevin:/input:ro"
          -v "/tmp/txsuite-alevin-h5ad:/output"
          txsuite-single-cell:test
          python /opt/txsuite/alevin_to_h5ad.py /input/sample1 --output /output/alevin.h5ad
      - run: >-
          docker run --rm
          -v "/tmp/txsuite-alevin-h5ad/alevin.h5ad:/input/data.h5ad:ro"
          txsuite-single-cell:test
          python -c "import numpy as np, scanpy as sc;
          a = sc.read_h5ad('/input/data.h5ad');
          assert a.shape == (2, 2), a.shape;
          assert list(a.var_names) == ['gene1', 'gene2'];
          assert {'counts', 'spliced', 'unspliced', 'ambiguous'} <= {k for k in a.layers if k};
          x = a.X.toarray() if hasattr(a.X, 'toarray') else np.asarray(a.X);
          assert x[0, 0] == 4 and x[1, 1] == 5, x;
          assert list(a.obs['sample'].unique()) == ['sample1']"
      - run: |
          test -s /tmp/txsuite-single-cell/analysis/analysis.h5ad
          test "$(wc -l < /tmp/txsuite-single-cell/analysis/marker-genes.tsv)" -gt 1
          grep -q '"batch_column": "batch"' /tmp/txsuite-single-cell/analysis/summary.json
          grep -q '"integration": "harmony"' /tmp/txsuite-single-cell/analysis/summary.json
          grep -q doublet_score /tmp/txsuite-single-cell/analysis/cell-qc.tsv
          grep -q '"counts_source": "layer:counts"' /tmp/txsuite-single-cell/pca/summary.json
          test "$(wc -l < /tmp/txsuite-single-cell/pca/clusters.tsv)" -eq 1
          test "$(wc -l < /tmp/txsuite-single-cell/pca/marker-genes.tsv)" -eq 1
          test "$(wc -l < /tmp/txsuite-single-cell/pseudobulk/pseudobulk-metadata.tsv)" -eq 5
          awk -F '\t' 'NR > 1 { for (i = 2; i <= NF; i++) if ($i !~ /^[0-9]+$/) exit 1 }' /tmp/txsuite-single-cell/pseudobulk/pseudobulk-counts.tsv
