[project]
name = "txsuite"
version = "0.2.0"
description = "Reproducible bulk, single-cell, and spatial transcriptomics toolbox."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TxSuite contributors" }]
dependencies = []

[project.scripts]
txsuite = "txsuite.cli:main"

# Test tooling only. Runtime stays dependency-free; CI runs the suite with
# `python -m unittest discover -s tests`, and this group makes the same tests
# runnable under `uv run pytest` with the optional schema checks enabled.
[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4",
  # Only needed to exercise the alevin-fry to .h5ad conversion outside the
  # single-cell image; those tests skip when the packages are absent.
  "anndata>=0.10",
  "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Hatch includes non-Python files below this package. CI audits the built wheel
# against every schema/preset source file so a future exclusion cannot regress it.
packages = ["src/txsuite"]

[tool.hatch.build.targets.sdist]
include = [
  "src/txsuite",
  "tests",
  "docs",
  "examples",
  "README.md",
  "pyproject.toml",
]
